<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Muscu Log</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #232733;
    --accent: #ff5a36;
    --text: #f2f4f8;
    --muted: #8b93a3;
    --ok: #2ecc71;
    --danger: #e74c3c;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    max-width: 520px; margin: 0 auto; min-height: 100%;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
    display: flex; flex-direction: column;
  }
  h1 { font-size: 26px; margin: 4px 0 4px; }
  h2 { font-size: 22px; margin: 4px 0 14px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .back {
    background: var(--card); border: 0; color: var(--text);
    width: 42px; height: 42px; border-radius: 50%; font-size: 20px;
  }
  button { font-family: inherit; color: var(--text); }
  .btn {
    width: 100%; padding: 16px; border: 0; border-radius: var(--radius);
    font-size: 17px; font-weight: 600; background: var(--accent); color: #fff;
    margin-top: 12px;
  }
  .btn.secondary { background: var(--card2); color: var(--text); }
  .btn.ok { background: var(--ok); color: #05210f; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn:active { transform: scale(.98); opacity: .9; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    background: var(--card); border: 0; border-radius: var(--radius);
    padding: 18px 10px; display: flex; flex-direction: column; align-items: center;
    gap: 10px; font-size: 16px; font-weight: 600;
  }
  .tile:active { background: var(--card2); }
  .tile svg { width: 56px; height: 56px; stroke: var(--accent); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row {
    background: var(--card); border: 0; border-radius: var(--radius);
    padding: 12px 14px; display: flex; align-items: center; gap: 14px;
    font-size: 16px; font-weight: 600; text-align: left; width: 100%;
  }
  .row:active { background: var(--card2); }
  .row svg { width: 40px; height: 40px; flex: none; stroke: var(--accent); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .row .grow { flex: 1; }
  .row .chev { color: var(--muted); font-size: 20px; }

  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .last { font-size: 13px; color: var(--muted); }
  .last b { color: var(--text); }
  .badge {
    display: inline-block; background: var(--card2); border-radius: 10px;
    padding: 3px 9px; margin: 2px 4px 2px 0; font-size: 12px; color: var(--text);
  }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; font-size: 28px; font-weight: 700; text-align: center;
    padding: 14px 6px; border-radius: 14px; border: 2px solid var(--card2);
    background: var(--card); color: var(--text); outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .setline { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid var(--card2); font-size: 15px; }
  .setline:last-child { border-bottom: 0; }
  .setline .x { color: var(--danger); background: none; border: 0; font-size: 16px; }
  input.text, input.pw {
    width: 100%; padding: 16px; font-size: 17px; border-radius: 14px;
    border: 2px solid var(--card2); background: var(--card); color: var(--text); outline: none; margin-top: 10px;
  }
  input.text:focus, input.pw:focus { border-color: var(--accent); }
  .err { color: var(--danger); font-size: 14px; margin-top: 10px; min-height: 18px; }
  .center { margin: auto 0; }
  .empty { color: var(--muted); text-align: center; padding: 20px; font-size: 14px; }
  .spacer { flex: 1; }
  .small-actions { display: flex; gap: 10px; }
  .small-actions .btn { font-size: 14px; padding: 12px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== CONFIG ===================== */
// Hash SHA-256 du mot de passe. Par défaut : "muscu2026"
// Pour changer : voir le README plus bas (ou changer le mot de passe dans l'app via ⚙️)
const DEFAULT_PW_HASH = "PLACEHOLDER";

const KEY_DATA = "muscu_data_v1";
const KEY_PW = "muscu_pwhash_v1";
const KEY_AUTH = "muscu_auth_v1";

/* ===================== ICONES SVG ===================== */
const ICONS = {
  pecs: '<svg viewBox="0 0 64 64"><path d="M32 14v34"/><path d="M32 18c-8-6-20-4-24 6-2 8 2 16 10 18 8 2 14-2 14-10"/><path d="M32 18c8-6 20-4 24 6 2 8-2 16-10 18-8 2-14-2-14-10"/></svg>',
  dos: '<svg viewBox="0 0 64 64"><path d="M32 8v48"/><path d="M12 16l20 8 20-8"/><path d="M14 22c-4 12 0 24 8 30l10 4 10-4c8-6 12-18 8-30"/><path d="M22 34l10 6 10-6"/></svg>',
  epaules: '<svg viewBox="0 0 64 64"><circle cx="32" cy="14" r="6"/><path d="M8 34c0-10 8-14 24-14s24 4 24 14"/><circle cx="12" cy="36" r="6"/><circle cx="52" cy="36" r="6"/><path d="M20 28v24h24V28"/></svg>',
  biceps: '<svg viewBox="0 0 64 64"><path d="M14 46c-4-8-2-18 6-22 6-3 10-1 14 3 3 3 8 3 12 1 4-2 8 2 6 8-2 8-10 12-20 12-8 0-14-1-18-2z"/><path d="M26 34c2-4 8-4 10 0"/></svg>',
  triceps: '<svg viewBox="0 0 64 64"><path d="M20 10c-4 10-6 22-2 34 2 6 8 10 14 10s12-4 14-10c4-12 2-24-2-34"/><path d="M32 18v28"/><path d="M24 24c-2 8 0 14 4 18"/><path d="M40 24c2 8 0 14-4 18"/></svg>',
  jambes: '<svg viewBox="0 0 64 64"><path d="M22 6h20l-2 22-4 10-2 20h-8l-2-20-4-10z"/><path d="M28 28h8"/></svg>',
  poulie: '<svg viewBox="0 0 64 64"><circle cx="32" cy="16" r="8"/><circle cx="32" cy="16" r="2"/><path d="M24 16v34"/><path d="M40 16v18"/><rect x="34" y="34" width="12" height="14" rx="2"/></svg>',
  machine: '<svg viewBox="0 0 64 64"><rect x="10" y="48" width="44" height="6" rx="2"/><path d="M18 48V12h8v36"/><path d="M26 22h22"/><path d="M46 14v16"/><circle cx="46" cy="14" r="3"/></svg>',
  halteres: '<svg viewBox="0 0 64 64"><rect x="6" y="22" width="8" height="20" rx="2"/><rect x="14" y="26" width="6" height="12" rx="1"/><rect x="50" y="22" width="8" height="20" rx="2"/><rect x="44" y="26" width="6" height="12" rx="1"/><path d="M20 32h24"/></svg>',
  curl: '<svg viewBox="0 0 64 64"><path d="M12 54l14-14"/><path d="M26 40c-4-8 2-18 12-18 8 0 12 6 10 14"/><circle cx="44" cy="14" r="5"/><path d="M8 58h22"/></svg>',
  cordes: '<svg viewBox="0 0 64 64"><circle cx="32" cy="10" r="4"/><path d="M32 14v10"/><path d="M32 24c-8 2-14 10-14 22"/><path d="M32 24c8 2 14 10 14 22"/><circle cx="18" cy="48" r="3"/><circle cx="46" cy="48" r="3"/></svg>',
  jambe_machine: '<svg viewBox="0 0 64 64"><path d="M8 50h30"/><path d="M12 50l8-22 18-6"/><path d="M38 22l16 22"/><rect x="48" y="40" width="10" height="14" rx="2"/></svg>',
  plus: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22"/><path d="M32 20v24M20 32h24"/></svg>',
  generic: '<svg viewBox="0 0 64 64"><rect x="6" y="22" width="8" height="20" rx="2"/><rect x="50" y="22" width="8" height="20" rx="2"/><path d="M14 32h36"/><rect x="18" y="26" width="5" height="12"/><rect x="41" y="26" width="5" height="12"/></svg>'
};

/* ===================== DONNEES PAR DEFAUT ===================== */
const GROUPS = [
  { id: "pecs", name: "Pecs" },
  { id: "dos", name: "Dos" },
  { id: "epaules", name: "Épaules" },
  { id: "biceps", name: "Biceps" },
  { id: "triceps", name: "Triceps" },
  { id: "jambes", name: "Jambes" },
];

function defaultData() {
  return {
    exercises: {
      pecs: [
        { name: "Chest press", icon: "machine" },
        { name: "Pec fly", icon: "machine" }
      ],
      dos: [
        { name: "Lat pulldown", icon: "poulie" },
        { name: "Low row", icon: "poulie" }
      ],
      epaules: [
        { name: "Shoulder press", icon: "machine" },
        { name: "Développé militaire assis", icon: "halteres" },
        { name: "Élévations latérales poulie position 19", icon: "poulie" },
        { name: "Élévations latérales poulie 45°", icon: "poulie" }
      ],
      biceps: [
        { name: "Incline curl poulie", icon: "poulie" },
        { name: "Preacher curl", icon: "curl" }
      ],
      triceps: [
        { name: "Extension poulie cordes", icon: "cordes" }
      ],
      jambes: [
        { name: "Leg press", icon: "jambe_machine" },
        { name: "Leg extension", icon: "jambe_machine" },
        { name: "Leg curl", icon: "jambe_machine" },
        { name: "Leg curl unilatéral", icon: "jambe_machine" }
      ]
    },
    // history: [{ date:"YYYY-MM-DD", group, exercise, sets:[{reps,weight}] }]
    history: []
  };
}

/* ===================== STOCKAGE ===================== */
let data;
function loadData() {
  try {
    const raw = localStorage.getItem(KEY_DATA);
    data = raw ? JSON.parse(raw) : defaultData();
  } catch (e) { data = defaultData(); }
}
function saveData() { localStorage.setItem(KEY_DATA, JSON.stringify(data)); }

function todayStr() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const j = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + j;
}
function fmtDate(s) {
  const [y, m, d] = s.split("-");
  return d + "/" + m + "/" + y;
}

/* ===================== AUTH ===================== */
async function sha256(txt) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function getPwHash() { return localStorage.getItem(KEY_PW) || DEFAULT_PW_HASH; }
function isAuth() { return sessionStorage.getItem(KEY_AUTH) === "1" || localStorage.getItem(KEY_AUTH) === "1"; }

/* ===================== ETAT / NAVIGATION ===================== */
const app = document.getElementById("app");
let state = { view: "login", group: null, exercise: null, sets: [], sessionStart: null };

function go(view, extra = {}) {
  Object.assign(state, { view }, extra);
  render();
  window.scrollTo(0, 0);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "'" }[c]));

/* ===================== VUES ===================== */
function render() {
  if (!isAuth() && state.view !== "login") state.view = "login";
  const views = { login: vLogin, home: vHome, groups: vGroups, exercises: vExercises, perf: vPerf, settings: vSettings, history: vHistory };
  views[state.view]();
}

/* ---- Login ---- */
function vLogin() {
  app.innerHTML = `
    <div class="center">
      <h1>🏋️ Muscu Log</h1>
      <div class="sub">Entre ton mot de passe pour accéder à tes séances.</div>
      <input class="pw" id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
      <div class="err" id="err"></div>
      <button class="btn" id="ok">Se connecter</button>
    </div>`;
  const pw = document.getElementById("pw");
  const submit = async () => {
    const h = await sha256(pw.value);
    if (h === getPwHash()) {
      localStorage.setItem(KEY_AUTH, "1"); // reste connecté sur cet appareil
      go("home");
    } else {
      document.getElementById("err").textContent = "Mot de passe incorrect.";
      pw.value = "";
    }
  };
  document.getElementById("ok").onclick = submit;
  pw.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
}

/* ---- Accueil ---- */
function vHome() {
  const today = todayStr();
  const todays = data.history.filter(h => h.date === today);
  app.innerHTML = `
    <div class="topbar">
      <div style="flex:1"><h1>🏋️ Muscu Log</h1><div class="sub" style="margin:0">${fmtDate(today)}</div></div>
      <button class="back" id="set">⚙️</button>
    </div>
    <h2 style="margin-top:18px">Séance du jour</h2>
    ${todays.length ? todays.map(h => `
      <div class="card">
        <b>${esc(h.exercise)}</b>
        <div style="margin-top:6px">${h.sets.map(s => `<span class="badge">${s.reps} × ${s.weight} kg</span>`).join("")}</div>
      </div>`).join("") : `<div class="empty">Aucun exercice enregistré aujourd'hui.</div>`}
    <button class="btn" id="add">＋ Ajouter un exercice</button>
    <button class="btn secondary" id="hist">📅 Historique</button>`;
  document.getElementById("add").onclick = () => go("groups");
  document.getElementById("hist").onclick = () => go("history");
  document.getElementById("set").onclick = () => go("settings");
}

/* ---- Groupes musculaires ---- */
function vGroups() {
  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0">Groupe musculaire</h2></div>
    <div class="grid" style="margin-top:12px">
      ${GROUPS.map(g => `<button class="tile" data-g="${g.id}">${ICONS[g.id]}<span>${g.name}</span></button>`).join("")}
    </div>`;
  document.getElementById("b").onclick = () => go("home");
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => go("exercises", { group: b.dataset.g }));
}

/* ---- Exercices d'un groupe ---- */
function vExercises() {
  const g = GROUPS.find(x => x.id === state.group);
  const list = data.exercises[state.group] || [];
  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0">${g.name}</h2></div>
    <div class="list" style="margin-top:12px">
      ${list.map((e, i) => `
        <button class="row" data-i="${i}">
          ${ICONS[e.icon] || ICONS.generic}
          <span class="grow">${esc(e.name)}</span><span class="chev">›</span>
        </button>`).join("")}
      <button class="row" id="new">${ICONS.plus}<span class="grow">Ajouter un exercice</span></button>
    </div>`;
  document.getElementById("b").onclick = () => go("groups");
  app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    go("perf", { exercise: list[+b.dataset.i].name, sets: [], sessionStart: Date.now() });
  });
  document.getElementById("new").onclick = () => vNewExercise();
}

/* ---- Ajout d'un exercice personnalisé ---- */
function vNewExercise() {
  const g = GROUPS.find(x => x.id === state.group);
  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0">Nouvel exercice</h2></div>
    <div class="sub">Groupe : ${g.name}</div>
    <input class="text" id="n" type="text" placeholder="Nom de l'exercice" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="btn" id="ok">Ajouter</button>`;
  document.getElementById("b").onclick = () => go("exercises");
  const n = document.getElementById("n");
  n.focus();
  const submit = () => {
    const name = n.value.trim();
    if (!name) { document.getElementById("err").textContent = "Donne un nom à l'exercice."; return; }
    const list = data.exercises[state.group];
    if (list.some(e => e.name.toLowerCase() === name.toLowerCase())) {
      document.getElementById("err").textContent = "Cet exercice existe déjà."; return;
    }
    list.push({ name, icon: "generic" });
    saveData();
    go("exercises");
  };
  document.getElementById("ok").onclick = submit;
  n.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
}

/* ---- Dernière performance (jour différent d'aujourd'hui) ---- */
function lastPerf(exercise) {
  const today = todayStr();
  const past = data.history
    .filter(h => h.exercise === exercise && h.date !== today)
    .sort((a, b) => b.date.localeCompare(a.date));
  return past[0] || null;
}

/* ---- Saisie de la performance ---- */
function vPerf() {
  const last = lastPerf(state.exercise);
  const n = state.sets.length + 1;
  const prev = state.sets[state.sets.length - 1];
  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0;font-size:19px">${esc(state.exercise)}</h2></div>

    <div class="card last">
      ${last ? `Dernière fois (<b>${fmtDate(last.date)}</b>) :<div style="margin-top:6px">${last.sets.map(s => `<span class="badge">${s.reps} × ${s.weight} kg</span>`).join("")}</div>`
             : `Aucune performance précédente.`}
    </div>

    ${state.sets.length ? `<div class="card" id="done">
      <div class="last" style="margin-bottom:4px">Séries validées</div>
      ${state.sets.map((s, i) => `<div class="setline"><span>Série ${i + 1}</span><span><b>${s.reps}</b> × <b>${s.weight}</b> kg</span><button class="x" data-del="${i}">✕</button></div>`).join("")}
    </div>` : ""}

    <h2 style="margin-top:6px">Série ${n}</h2>
    <div class="inputs">
      <div class="field"><label>Répétitions</label><input id="reps" type="number" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="0"></div>
      <div class="field"><label>Charge (kg)</label><input id="w" type="number" inputmode="decimal" step="0.5" min="0" placeholder="${prev ? prev.weight : 0}"></div>
    </div>
    <div class="err" id="err"></div>

    <button class="btn" id="next">Série suivante</button>
    <button class="btn ok" id="end">Terminer</button>`;

  const reps = document.getElementById("reps");
  const w = document.getElementById("w");
  if (prev) w.value = prev.weight; // préremplit la charge précédente
  reps.focus();

  const readSet = () => {
    const r = parseInt(reps.value, 10);
    const kg = parseFloat(String(w.value).replace(",", "."));
    if (isNaN(r) || r <= 0 || isNaN(kg) || kg < 0) return null;
    return { reps: r, weight: kg };
  };

  document.getElementById("b").onclick = () => {
    if (state.sets.length && !confirm("Abandonner les séries non enregistrées ?")) return;
    go("exercises");
  };
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    state.sets.splice(+b.dataset.del, 1); render();
  });
  document.getElementById("next").onclick = () => {
    const s = readSet();
    if (!s) { document.getElementById("err").textContent = "Renseigne les répétitions et la charge."; return; }
    state.sets.push(s);
    render();
  };
  document.getElementById("end").onclick = () => {
    const s = readSet();
    // Si des champs valides sont remplis, on compte la série en cours
    if (s) state.sets.push(s);
    else if (reps.value || w.value) {
      document.getElementById("err").textContent = "Série incomplète : complète-la ou vide les champs."; return;
    }
    if (!state.sets.length) { document.getElementById("err").textContent = "Aucune série à enregistrer."; return; }
    data.history.push({ date: todayStr(), group: state.group, exercise: state.exercise, sets: state.sets.slice() });
    saveData();
    state.sets = [];
    go("groups");
  };
}

/* ---- Historique ---- */
function vHistory() {
  const byDate = {};
  data.history.forEach(h => (byDate[h.date] = byDate[h.date] || []).push(h));
  const dates = Object.keys(byDate).sort().reverse();
  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0">Historique</h2></div>
    ${dates.length ? dates.map(d => `
      <div class="sub" style="margin:14px 0 6px"><b>${fmtDate(d)}</b></div>
      ${byDate[d].map(h => `<div class="card"><b>${esc(h.exercise)}</b>
        <div style="margin-top:6px">${h.sets.map(s => `<span class="badge">${s.reps} × ${s.weight} kg</span>`).join("")}</div></div>`).join("")}
    `).join("") : `<div class="empty">Pas encore de séance enregistrée.</div>`}`;
  document.getElementById("b").onclick = () => go("home");
}

/* ---- Réglages ---- */
function vSettings() {
  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0">Réglages</h2></div>

    <div class="card">
      <b>Sauvegarde des données</b>
      <div class="sub" style="margin:6px 0 0">Tes données sont stockées uniquement dans ce navigateur. Exporte-les régulièrement.</div>
      <div class="small-actions">
        <button class="btn secondary" id="exp">Exporter</button>
        <button class="btn secondary" id="imp">Importer</button>
      </div>
      <input type="file" id="file" accept="application/json" style="display:none">
    </div>

    <div class="card">
      <b>Changer le mot de passe</b>
      <input class="pw" id="np" type="password" placeholder="Nouveau mot de passe" autocomplete="new-password">
      <div class="err" id="err"></div>
      <button class="btn secondary" id="chg" style="margin-top:0">Modifier</button>
    </div>

    <button class="btn danger" id="out">Se déconnecter</button>`;

  document.getElementById("b").onclick = () => go("home");

  document.getElementById("exp").onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "muscu-backup-" + todayStr() + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const file = document.getElementById("file");
  document.getElementById("imp").onclick = () => file.click();
  file.onchange = () => {
    const f = file.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d.exercises || !d.history) throw new Error();
        if (confirm("Remplacer toutes les données actuelles par ce fichier ?")) {
          data = d; saveData(); alert("Import réussi."); go("home");
        }
      } catch (e) { alert("Fichier invalide."); }
    };
    r.readAsText(f);
  };
  document.getElementById("chg").onclick = async () => {
    const v = document.getElementById("np").value;
    if (v.length < 4) { document.getElementById("err").textContent = "Minimum 4 caractères."; return; }
    localStorage.setItem(KEY_PW, await sha256(v));
    alert("Mot de passe modifié.");
    document.getElementById("np").value = "";
  };
  document.getElementById("out").onclick = () => {
    localStorage.removeItem(KEY_AUTH); sessionStorage.removeItem(KEY_AUTH);
    go("login");
  };
}

(async function init() {
  // Initialise le hash par défaut du mot de passe "muscu2026" au premier lancement
  if (!localStorage.getItem(KEY_PW)) localStorage.setItem(KEY_PW, await sha256("muscu2026"));
  loadData();
  go(isAuth() ? "home" : "login");
})();
</script>

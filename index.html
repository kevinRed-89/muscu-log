<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Muscu Log</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --card2: #232733;
    --accent: #ff5a36; --text: #f2f4f8; --muted: #8b93a3;
    --ok: #2ecc71; --danger: #e74c3c; --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    max-width: 520px; margin: 0 auto; min-height: 100%;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
    display: flex; flex-direction: column;
  }
  h1 { font-size: 26px; margin: 4px 0; }
  h2 { font-size: 22px; margin: 4px 0 14px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .back {
    background: var(--card); border: 0; color: var(--text);
    width: 42px; height: 42px; border-radius: 50%; font-size: 20px; cursor: pointer;
  }
  button { font-family: inherit; color: var(--text); }
  .btn {
    width: 100%; padding: 16px; border: 0; border-radius: var(--radius);
    font-size: 17px; font-weight: 600; background: var(--accent); color: #fff;
    cursor: pointer; margin-top: 10px;
  }
  .btn.secondary { background: var(--card2); color: var(--text); }
  .btn.ok { background: var(--ok); color: #08210f; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    background: var(--card); border: 0; border-radius: var(--radius);
    padding: 18px 8px; display: flex; flex-direction: column; align-items: center;
    gap: 8px; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 120px;
    justify-content: center; text-align: center;
  }
  .tile:active { background: var(--card2); }
  .tile svg { width: 56px; height: 56px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row {
    background: var(--card); border: 0; border-radius: var(--radius);
    padding: 12px 14px; display: flex; align-items: center; gap: 14px;
    font-size: 16px; font-weight: 600; text-align: left; cursor: pointer; width: 100%;
  }
  .row svg { width: 40px; height: 40px; flex-shrink: 0; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .last {
    background: var(--card); border-radius: 12px; padding: 8px 12px;
    font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.5;
  }
  .last.clickable { cursor: pointer; border: 1px dashed var(--card2); }
  .last b { color: var(--text); }
  .last .notes { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--card2); color: var(--text); }
  .last .notes div { margin-bottom: 4px; }
  .hint { color: var(--accent); font-size: 11px; margin-top: 4px; }
  input[type=text], input[type=password], input[type=number], textarea {
    width: 100%; padding: 16px; font-size: 18px; border-radius: 14px;
    border: 2px solid var(--card2); background: var(--card); color: var(--text); outline: none;
    font-family: inherit;
  }
  textarea { font-size: 15px; padding: 12px; resize: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  input:disabled { opacity: .35; }
  .field { margin-bottom: 14px; }
  .field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .setline {
    display: flex; justify-content: space-between; padding: 8px 4px;
    border-bottom: 1px solid var(--card2); font-size: 15px; gap: 10px;
  }
  .setline:last-child { border-bottom: 0; }
  .setnote { font-size: 12px; color: var(--muted); padding: 0 4px 6px; font-style: italic; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 8px; }
  .center { margin: auto 0; }
  .spacer { flex: 1; }
  .small { font-size: 12px; color: var(--muted); }
  .pill { background: var(--accent); color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 12px; }
  .dropline { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 15px; cursor: pointer; }
  .dropline input { width: 22px; height: 22px; accent-color: var(--accent); }
  .tag { background: #c77dff; color: #1a0a26; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
  .chartbox { background: var(--card); border-radius: 12px; padding: 8px 10px; margin-bottom: 14px; cursor: pointer; }
  .chartbox .small { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .chartbox svg { width: 100%; height: 70px; display: block; }
  .histhead { display: flex; justify-content: space-between; align-items: center; }
  .del {
    background: transparent; border: 1px solid var(--danger); color: var(--danger);
    border-radius: 10px; padding: 4px 10px; font-size: 14px; cursor: pointer;
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay .modal {
    background: var(--card); border-radius: var(--radius); padding: 16px;
    width: 100%; max-width: 520px;
  }
  .overlay .modal svg { width: 100%; height: 300px; display: block; }
  .overlay h3 { margin: 0 0 10px; font-size: 17px; }
</style>
</head>
<body>
<div id="app"><p style="padding:20px;color:#8b93a3">Chargement…</p></div>
<noscript><p style="padding:20px;color:#ff8a8a">JavaScript est désactivé.</p></noscript>

<script>
/* ===================== ERREURS A L'ECRAN ===================== */
function showError(msg) {
  document.getElementById("app").innerHTML =
    '<div style="padding:20px;color:#ff8a8a;font-size:14px;word-break:break-word"><b>Erreur :</b><br>' + msg + '</div>';
}
window.addEventListener("error", e => showError((e.message || e) + " (ligne " + e.lineno + ")"));
window.addEventListener("unhandledrejection", e => showError(e.reason && e.reason.message || e.reason));

/* ===================== CONFIG / DONNEES ===================== */
const KEY_DATA = "muscu_data_v1";
const KEY_PW = "muscu_pw_hash";
const KEY_AUTH = "muscu_auth";
const DEFAULT_PASSWORD = "muscu2026";

const GROUPS = ["Pecs", "Dos", "Epaules", "Biceps", "Triceps", "Jambes"];
const DEFAULT_EXOS = {
  Pecs: ["chest press", "pec fly"],
  Dos: ["lat pulldown", "low row"],
  Epaules: ["shoulder press", "développé militaire assis", "élévations latérales poulie position 19", "élévations latérales poulie 45°"],
  Biceps: ["incline curl poulie", "preacher curl"],
  Triceps: ["extension poulie cordes"],
  Jambes: ["leg press", "leg extension", "leg curl", "leg curl unilatéral"]
};

let data = { exos: {}, sessions: [] };
// session = { date, entries: [ {group, exo, sets:[{reps,weight,note?,dropset?}]} ] }

function loadData() {
  try {
    const raw = localStorage.getItem(KEY_DATA);
    if (raw) data = JSON.parse(raw);
  } catch (e) { data = { exos: {}, sessions: [] }; }
  if (!data.exos) data.exos = {};
  if (!data.sessions) data.sessions = [];
  GROUPS.forEach(g => { if (!data.exos[g]) data.exos[g] = DEFAULT_EXOS[g].slice(); });
}
function saveData() {
  try { localStorage.setItem(KEY_DATA, JSON.stringify(data)); } catch (e) {}
}

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDate(iso) {
  const [y, m, d] = iso.split("-");
  return d + "/" + m + "/" + y;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    switch (c) {
      case "&": return "&" + "amp;";
      case "<": return "&" + "lt;";
      case ">": return "&" + "gt;";
      case '"': return "&" + "quot;";
      default:  return "&" + "#39;";
    }
  });
}
function fmtSet(s) {
  return s.dropset ? "Dropset" : s.reps + "×" + s.weight + "kg";
}

/* ===================== MOT DE PASSE ===================== */
async function sha256(str) {
  if (!(window.crypto && crypto.subtle)) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return "fb" + h;
  }
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function isAuth() {
  try {
    return localStorage.getItem(KEY_AUTH) === "1" || sessionStorage.getItem(KEY_AUTH) === "1";
  } catch (e) { return false; }
}

/* ===================== ICONES SVG ===================== */
const S = 'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  Pecs: `<svg viewBox="0 0 48 48" ${S} style="color:#ff5a36"><path d="M8 14c6-4 12-4 16 0 4-4 10-4 16 0v10c-4 8-10 10-16 6-6 4-12 2-16-6z"/><path d="M24 14v16"/></svg>`,
  Dos: `<svg viewBox="0 0 48 48" ${S} style="color:#4da3ff"><path d="M6 10l18 6 18-6-4 18-14 10-14-10z"/><path d="M24 16v22"/></svg>`,
  Epaules: `<svg viewBox="0 0 48 48" ${S} style="color:#ffc233"><circle cx="24" cy="16" r="6"/><path d="M6 38c0-10 8-14 18-14s18 4 18 14"/></svg>`,
  Biceps: `<svg viewBox="0 0 48 48" ${S} style="color:#2ecc71"><path d="M8 34c0-10 6-18 14-18 4 0 6 3 10 3 6 0 10 4 10 10 0 6-6 8-12 8H14c-4 0-6-1-6-3z"/></svg>`,
  Triceps: `<svg viewBox="0 0 48 48" ${S} style="color:#c77dff"><path d="M10 8c-2 12 0 22 8 30 8 0 16-4 20-14-4 2-8 0-10-4-2-4-2-8-4-12z"/></svg>`,
  Jambes: `<svg viewBox="0 0 48 48" ${S} style="color:#ff7aa8"><path d="M18 6c-2 12 0 20 2 26l-2 10h8l2-10c2-6 4-14 0-26z"/></svg>`,
  dumbbell: `<svg viewBox="0 0 48 48" ${S} style="color:#ff5a36"><path d="M6 18v12M12 14v20M36 14v20M42 18v12M12 24h24"/></svg>`,
  cable: `<svg viewBox="0 0 48 48" ${S} style="color:#4da3ff"><rect x="8" y="6" width="6" height="36" rx="2"/><path d="M14 12h18l6 12"/><circle cx="38" cy="28" r="4"/></svg>`,
  machine: `<svg viewBox="0 0 48 48" ${S} style="color:#ffc233"><rect x="8" y="30" width="32" height="8" rx="2"/><path d="M14 30V12h20v18M24 12V6"/></svg>`,
  legs: `<svg viewBox="0 0 48 48" ${S} style="color:#ff7aa8"><path d="M6 36h36M10 36l10-14h10l8 14M20 22l-4-10"/></svg>`
};
function exoIcon(group, name) {
  const n = name.toLowerCase();
  if (n.includes("poulie") || n.includes("pulldown") || n.includes("row")) return ICONS.cable;
  if (n.includes("leg")) return ICONS.legs;
  if (n.includes("press") || n.includes("fly") || n.includes("curl") || n.includes("développé")) return ICONS.machine;
  return ICONS.dumbbell;
}

/* ===================== ETAT / NAVIGATION ===================== */
const app = document.getElementById("app");
let state = { screen: "login", group: null, exo: null, sets: [], currentSession: null, showNotes: false };
function go(screen, extra) { Object.assign(state, extra || {}); state.screen = screen; render(); window.scrollTo(0, 0); }

function render() {
  const views = { login: vLogin, home: vHome, groups: vGroups, exos: vExos, perf: vPerf, history: vHistory, settings: vSettings };
  const fn = views[state.screen] || vLogin;
  fn();
}

/* ===================== VUES ===================== */
function vLogin() {
  app.innerHTML = `
    <div class="center">
      <div style="text-align:center;font-size:56px">🏋️</div>
      <h1 style="text-align:center">Muscu Log</h1>
      <p class="sub" style="text-align:center">Entre ton mot de passe</p>
      <div class="field"><input type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password"></div>
      <button class="btn" id="ok">Se connecter</button>
      <div class="err" id="err"></div>
    </div>`;
  const submit = async () => {
    const v = document.getElementById("pw").value;
    const h = await sha256(v);
    let stored = localStorage.getItem(KEY_PW);
    if (!stored) { stored = await sha256(DEFAULT_PASSWORD); localStorage.setItem(KEY_PW, stored); }
    if (h === stored) { localStorage.setItem(KEY_AUTH, "1"); go("home"); }
    else document.getElementById("err").textContent = "Mot de passe incorrect.";
  };
  document.getElementById("ok").onclick = submit;
  document.getElementById("pw").onkeydown = e => { if (e.key === "Enter") submit(); };
}

function vHome() {
  const cs = state.currentSession;
  const n = cs ? cs.entries.length : 0;
  app.innerHTML = `
    <h1>Muscu Log</h1>
    <p class="sub">${fmtDate(today())}${n ? ' · <span class="pill">' + n + ' exo' + (n > 1 ? 's' : '') + '</span>' : ''}</p>
    <button class="btn" id="add">➕ Ajouter un exercice</button>
    ${n ? '<button class="btn ok" id="end">✅ Terminer la séance</button>' : ''}
    <button class="btn secondary" id="hist">📜 Historique</button>
    <button class="btn secondary" id="set">⚙️ Réglages</button>`;
  document.getElementById("add").onclick = () => {
    if (!state.currentSession) state.currentSession = { date: today(), entries: [] };
    go("groups");
  };
  if (n) document.getElementById("end").onclick = () => { state.currentSession = null; go("home"); };
  document.getElementById("hist").onclick = () => go("history");
  document.getElementById("set").onclick = () => go("settings");
}

function vGroups() {
  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0">Groupe musculaire</h2></div>
    <div class="grid">
      ${GROUPS.map(g => `<button class="tile" data-g="${g}">${ICONS[g]}<span>${g}</span></button>`).join("")}
    </div>`;
  document.getElementById("b").onclick = () => go("home");
  app.querySelectorAll(".tile").forEach(t => t.onclick = () => go("exos", { group: t.dataset.g }));
}

function vExos() {
  const g = state.group;
  const list = data.exos[g];
  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0">${g}</h2></div>
    <div class="list">
      ${list.map((e, i) => `<button class="row" data-i="${i}">${exoIcon(g, e)}<span>${esc(e)}</span></button>`).join("")}
    </div>
    <div class="card" style="margin-top:16px">
      <div class="field"><label>Nouvel exercice</label><input type="text" id="newex" placeholder="Nom de l'exercice"></div>
      <button class="btn secondary" id="addex" style="margin-top:0">➕ Ajouter à ${g}</button>
    </div>`;
  document.getElementById("b").onclick = () => go("groups");
  app.querySelectorAll(".row").forEach(r => r.onclick = () => go("perf", { exo: list[+r.dataset.i], sets: [], showNotes: false }));
  document.getElementById("addex").onclick = () => {
    const v = document.getElementById("newex").value.trim();
    if (!v) return;
    if (!list.some(x => x.toLowerCase() === v.toLowerCase())) { list.push(v); saveData(); }
    vExos();
  };
}

/* Dernière performance : on ignore uniquement la séance en cours (pas la date du jour).
   Dès que la séance est terminée (currentSession = null), tout est visible, même le même jour. */
function lastPerformance(exo) {
  const cs = state.currentSession;
  for (let i = data.sessions.length - 1; i >= 0; i--) {
    const s = data.sessions[i];
    for (let j = s.entries.length - 1; j >= 0; j--) {
      const e = s.entries[j];
      if (e.exo !== exo) continue;
      if (cs && e === e._skip) continue;
      if (cs && e.sid === cs.id) continue; // entrée appartenant à la séance en cours
      return { date: s.date, sets: e.sets };
    }
  }
  return null;
}

/* Progression : meilleure charge (hors dropset) par séance pour un exo */
function progressionPoints(exo) {
  const pts = [];
  data.sessions.forEach(s => {
    let best = null;
    s.entries.forEach(e => {
      if (e.exo !== exo) return;
      e.sets.forEach(x => {
        if (x.dropset) return;
        if (best === null || x.weight > best) best = x.weight;
      });
    });
    if (best !== null) pts.push({ date: s.date, v: best });
  });
  return pts;
}

function chartSVG(pts, big) {
  if (!pts.length) return '<div class="small" style="padding:20px;text-align:center">Pas encore de données</div>';
  const W = 300, H = big ? 200 : 70, P = big ? 28 : 8;
  const vals = pts.map(p => p.v);
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (min === max) { min -= 1; max += 1; }
  const x = i => pts.length === 1 ? W / 2 : P + i * (W - 2 * P) / (pts.length - 1);
  const y = v => H - P - (v - min) / (max - min) * (H - 2 * P);
  const line = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  let extra = "";
  if (big) {
    extra += `<text x="2" y="${y(max) + 4}" fill="#8b93a3" font-size="10">${max}</text>`;
    extra += `<text x="2" y="${y(min) + 4}" fill="#8b93a3" font-size="10">${min}</text>`;
    extra += `<text x="${P}" y="${H - 6}" fill="#8b93a3" font-size="9">${fmtDate(pts[0].date).slice(0, 5)}</text>`;
    extra += `<text x="${W - P}" y="${H - 6}" fill="#8b93a3" font-size="9" text-anchor="end">${fmtDate(pts[pts.length - 1].date).slice(0, 5)}</text>`;
    extra += pts.map((p, i) => `<text x="${x(i)}" y="${y(p.v) - 7}" fill="#f2f4f8" font-size="9" text-anchor="middle">${p.v}</text>`).join("");
  }
  const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${big ? 3.5 : 2.5}" fill="#ff5a36"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" ${big ? 'style="height:300px"' : ''}>
    <path d="${line}" fill="none" stroke="#ff5a36" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${dots}${extra}</svg>`;
}

function openChart(exo) {
  const pts = progressionPoints(exo);
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal"><h3>${esc(exo)} — charge max par séance (kg)</h3>${chartSVG(pts, true)}
    <button class="btn secondary" style="margin-top:12px">Fermer</button></div>`;
  ov.onclick = e => { if (e.target === ov || e.target.tagName === "BUTTON") ov.remove(); };
  document.body.appendChild(ov);
}

function vPerf() {
  const exo = state.exo;
  const last = lastPerformance(exo);
  const prev = state.sets.length ? state.sets[state.sets.length - 1] : null;
  const prevWeight = prev && !prev.dropset ? prev.weight : "";
  const notes = last ? last.sets.map((s, i) => s.note ? `<div><b>Série ${i + 1} :</b> ${esc(s.note)}</div>` : "").join("") : "";
  const hasNotes = notes !== "";
  const pts = progressionPoints(exo);

  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0">${esc(exo)}</h2></div>
    ${last ? `<div class="last${hasNotes ? " clickable" : ""}" id="lastbox">Dernière fois (${fmtDate(last.date)}) :<br><b>${last.sets.map(fmtSet).join(" · ")}</b>
        ${hasNotes ? `<div class="hint">${state.showNotes ? "▲ Masquer les notes" : "▼ Voir les notes"}</div>` : ""}
        ${hasNotes && state.showNotes ? `<div class="notes">${notes}</div>` : ""}</div>`
           : `<div class="last">Pas d'historique pour cet exercice.</div>`}
    <div class="chartbox" id="chart">
      <div class="small"><span>Progression (charge max)</span><span>🔍 agrandir</span></div>
      ${chartSVG(pts, false)}
    </div>
    <div class="card">
      <div class="small" style="margin-bottom:8px">Série ${state.sets.length + 1}</div>
      <label class="dropline"><input type="checkbox" id="drop"> Dropset</label>
      <div class="two">
        <div class="field"><label>Répétitions</label><input type="number" inputmode="numeric" id="reps" placeholder="0"></div>
        <div class="field"><label>Charge (kg)</label><input type="number" inputmode="decimal" step="0.5" id="w" placeholder="0" value="${prevWeight}"></div>
      </div>
      <div class="field" style="margin-bottom:0"><label>Note (optionnel)</label><textarea id="note" rows="2" placeholder="Ressenti, réglage machine…"></textarea></div>
      <div class="err" id="err"></div>
    </div>
    ${state.sets.length ? `<div class="card">${state.sets.map((s, i) => `
      <div class="setline"><span>Série ${i + 1}</span><b>${s.dropset ? '<span class="tag">Dropset</span>' : s.reps + " × " + s.weight + " kg"}</b></div>
      ${s.note ? `<div class="setnote">${esc(s.note)}</div>` : ""}`).join("")}</div>` : ""}
    <button class="btn secondary" id="next">➡️ Série suivante</button>
    <button class="btn ok" id="done">✔️ Terminer</button>`;

  document.getElementById("b").onclick = () => go("exos");
  document.getElementById("chart").onclick = () => openChart(exo);
  if (hasNotes) document.getElementById("lastbox").onclick = () => { state.showNotes = !state.showNotes; vPerf(); };

  const dropEl = document.getElementById("drop");
  const repsEl = document.getElementById("reps");
  const wEl = document.getElementById("w");
  dropEl.onchange = () => {
    repsEl.disabled = wEl.disabled = dropEl.checked;
    if (dropEl.checked) { repsEl.value = ""; wEl.value = ""; }
    else wEl.value = prevWeight;
  };

  const readSet = () => {
    const note = document.getElementById("note").value.trim();
    if (dropEl.checked) {
      const s = { dropset: true, reps: 0, weight: 0 };
      if (note) s.note = note;
      return s;
    }
    const reps = parseInt(repsEl.value, 10);
    const weight = parseFloat(String(wEl.value).replace(",", "."));
    if (!(reps > 0) || isNaN(weight) || weight < 0) {
      document.getElementById("err").textContent = "Renseigne les répétitions et la charge (ou coche Dropset).";
      return null;
    }
    const s = { reps, weight };
    if (note) s.note = note;
    return s;
  };
  document.getElementById("next").onclick = () => {
    const s = readSet(); if (!s) return;
    state.sets.push(s); vPerf();
  };
  document.getElementById("done").onclick = () => {
    const hasInput = dropEl.checked || repsEl.value !== "";
    if (hasInput) { const s = readSet(); if (!s) return; state.sets.push(s); }
    if (!state.sets.length) { document.getElementById("err").textContent = "Aucune série saisie."; return; }
    const cs = state.currentSession || (state.currentSession = { date: today(), entries: [] });
    if (!cs.id) cs.id = "s" + Date.now();
    cs.entries.push({ group: state.group, exo: state.exo, sets: state.sets });
    let sess = data.sessions.find(s => s.sid === cs.id);
    if (!sess) { sess = { sid: cs.id, date: cs.date, entries: [] }; data.sessions.push(sess); }
    sess.entries.push({ group: state.group, exo: state.exo, sets: state.sets, sid: cs.id });
    saveData();
    go("groups", { sets: [] });
  };
}

function vHistory() {
  const sessions = data.sessions.map((s, idx) => ({ s, idx })).reverse();
  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0">Historique</h2></div>
    ${sessions.length ? sessions.map(o => `
      <div class="card">
        <div class="histhead"><b>${fmtDate(o.s.date)}</b><button class="del" data-i="${o.idx}">🗑 Supprimer</button></div>
        ${o.s.entries.map(e => `
          <div style="margin-top:10px"><span style="font-weight:600">${esc(e.exo)}</span> <span class="small">(${e.group})</span>
          <div class="small">${e.sets.map(fmtSet).join(" · ")}</div>
          ${e.sets.some(x => x.note) ? `<div class="small" style="font-style:italic">${e.sets.map((x, i) => x.note ? "S" + (i + 1) + " : " + esc(x.note) : "").filter(Boolean).join(" | ")}</div>` : ""}
          </div>`).join("")}
      </div>`).join("") : '<p class="sub">Aucune séance enregistrée.</p>'}`;
  document.getElementById("b").onclick = () => go("home");
  app.querySelectorAll(".del").forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.i;
    const s = data.sessions[i];
    if (!confirm("Supprimer la séance du " + fmtDate(s.date) + " ?")) return;
    // si c'est la séance en cours, on la réinitialise aussi
    if (state.currentSession && state.currentSession.id === s.sid) state.currentSession = null;
    data.sessions.splice(i, 1);
    saveData();
    vHistory();
  });
}

function vSettings() {
  app.innerHTML = `
    <div class="topbar"><button class="back" id="b">←</button><h2 style="margin:0">Réglages</h2></div>
    <div class="card">
      <div class="field"><label>Nouveau mot de passe</label><input type="password" id="np" placeholder="Min. 4 caractères"></div>
      <button class="btn secondary" id="chg" style="margin-top:0">Changer le mot de passe</button>
      <div class="err" id="err"></div>
    </div>
    <div class="card">
      <button class="btn secondary" id="exp" style="margin-top:0">⬇️ Exporter mes données</button>
      <button class="btn secondary" id="imp">⬆️ Importer des données</button>
      <input type="file" id="file" accept="application/json" style="display:none">
    </div>
    <button class="btn danger" id="out">Se déconnecter</button>`;
  document.getElementById("b").onclick = () => go("home");
  document.getElementById("chg").onclick = async () => {
    const v = document.getElementById("np").value;
    if (v.length < 4) { document.getElementById("err").textContent = "Minimum 4 caractères."; return; }
    localStorage.setItem(KEY_PW, await sha256(v));
    alert("Mot de passe modifié.");
    document.getElementById("np").value = "";
  };
  document.getElementById("exp").onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "muscu-log-" + today() + ".json";
    a.click();
  };
  document.getElementById("imp").onclick = () => document.getElementById("file").click();
  document.getElementById("file").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d.sessions || !d.exos) throw new Error("Format invalide");
        data = d; loadData(); saveData();
        alert("Import réussi.");
      } catch (err) { alert("Fichier invalide."); }
    };
    r.readAsText(f);
  };
  document.getElementById("out").onclick = () => {
    localStorage.removeItem(KEY_AUTH); sessionStorage.removeItem(KEY_AUTH);
    go("login");
  };
}

/* ===================== DEMARRAGE ===================== */
(async function init() {
  try {
    if (!localStorage.getItem(KEY_PW)) localStorage.setItem(KEY_PW, await sha256(DEFAULT_PASSWORD));
    loadData();
    go(isAuth() ? "home" : "login");
  } catch (err) {
    showError(err.message);
  }
})();
</script>
